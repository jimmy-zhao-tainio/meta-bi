name: Package consumer

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  package-consumer:
    runs-on: windows-latest
    steps:
      - name: Checkout meta-bi
        uses: actions/checkout@v4

      - name: Checkout meta foundation
        uses: actions/checkout@v4
        with:
          repository: jimmy-zhao-tainio/meta
          path: meta-foundation

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Pack foundation feed
        shell: pwsh
        working-directory: meta-foundation
        run: .\pack-internal.cmd "${{ runner.temp }}\meta-foundation-feed"

      - name: Verify isolated consumers and package closures
        shell: pwsh
        run: .\scripts\verify-package-consumer.ps1 -FoundationFeed "${{ runner.temp }}\meta-foundation-feed"
